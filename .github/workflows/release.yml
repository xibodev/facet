name: Prebuilt release

on:
  push:
    tags: ['v*']
    branches: [staging]
    paths:
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'install.sh'
      - 'installer/**'
      - 'scripts/package-release.py'
      - 'scripts/generate-notices.py'
      - 'scripts/test-prebuilt-install.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Facet 2.0 ships one native executable, `facet`, plus its guidance bundle.
jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yml
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check tag version
        shell: bash
        run: |
          python -c 'import json,os; v=json.load(open("package.json"))["version"]; ref=os.environ["GITHUB_REF"]; assert not ref.startswith("refs/tags/") or ref == "refs/tags/v"+v, "Tag must match package.json"'
      - name: Installer syntax
        shell: bash
        run: bash -n install.sh
      - name: Terminal menu interaction
        if: runner.os != 'Windows'
        run: python3 scripts/test-installer-menu.py
      - name: Package the facet binary, guidance bundle and notices
        run: python scripts/package-release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out build/release
      - name: Archive ships only the facet binary and generated notices
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'EOF'
          import json, os, pathlib, zipfile
          version = json.load(open("package.json"))["version"]
          goos, goarch = os.environ["TARGET_OS"], os.environ["TARGET_ARCH"]
          archive = pathlib.Path("build/release") / f"facet-{version}-{goos}-{goarch}.zip"
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              binaries = sorted(n for n in names if n.startswith("bin/"))
              expected = ["bin/facet.exe" if goos == "windows" else "bin/facet"]
              assert binaries == expected, f"{archive.name} ships {binaries}, want {expected}"
              heading = f"## Go modules linked into the `facet` binary ({goos}/{goarch})"
              notices = [n for n in names if "/" not in n and n.lower().endswith(".md") and heading in z.read(n).decode("utf-8")]
              assert notices, f"{archive.name} has no generated third-party notices for {goos}/{goarch}"
          print(f"PASS {archive.name}: {binaries[0]}, notices {notices[0]}")
          EOF
      - name: Microsoft Defender finds nothing in the Windows archive
        # 2.1.0's windows/amd64 binary was published and then flagged by
        # Defender (Trojan:Win32/Bearfoos.A!ml, a machine-learning verdict).
        # A detection fails the release; a runner that cannot scan warns.
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $archive = Join-Path $env:GITHUB_WORKSPACE "build/release/facet-$version-windows-${{ matrix.arch }}.zip"
          $platform = Get-ChildItem (Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform') -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if ($platform -and (Test-Path (Join-Path $platform.FullName 'MpCmdRun.exe'))) { $mp = Join-Path $platform.FullName 'MpCmdRun.exe' }
          if (-not (Test-Path $mp)) { Write-Host "::warning::Microsoft Defender is not available on this runner; $archive was not scanned."; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          & $mp -Scan -ScanType 3 -File $archive -DisableRemediation | Out-Host
          switch ($LASTEXITCODE) {
            0 { Write-Host "Microsoft Defender found no threats in $archive." }
            2 { throw "Microsoft Defender flags $archive. Do not publish it: rebuild, or submit the file to Microsoft as a false positive." }
            default { Write-Host "::warning::Microsoft Defender could not scan $archive (exit $LASTEXITCODE); it is not verified." }
          }
      - name: Validate native package and project integration
        run: python scripts/test-prebuilt-install.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} --release-dir build/release
      - name: Install FFmpeg for package integration test (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS)
        if: matrix.os == 'darwin'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows x64)
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        run: choco install ffmpeg --yes --no-progress
      - name: Smoke install from the archive (no optional components, PATH untouched)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          release="$GITHUB_WORKSPACE/build/release"
          export HOME="$(mktemp -d "$RUNNER_TEMP/facet-home-XXXXXX")"
          bash install.sh --yes --components none --no-path \
            --archive "$release/facet-$version-${{ matrix.os }}-${{ matrix.arch }}.zip" \
            --checksums "$release/checksums-${{ matrix.os }}-${{ matrix.arch }}.txt"
          facet="$HOME/.facet/current/bin/facet"
          test "$("$facet" version)" = "facet v$version"
          "$facet" doctor
          for profile in .profile .bashrc .bash_profile .zshrc .zprofile .config/fish/config.fish; do
            if [ -e "$HOME/$profile" ]; then echo "--no-path wrote $profile" >&2; exit 1; fi
          done
      - name: Smoke install from the archive (Windows, no optional components, PATH untouched)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # The Windows arm64 runner has no FFmpeg package to install, so its
          # install skips media verification; everything else is the same.
          SKIP_VERIFY: ${{ matrix.arch == 'arm64' && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $release = Join-Path $env:GITHUB_WORKSPACE 'build/release'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $arch = '${{ matrix.arch }}'
          $skip = @{}
          if ($env:SKIP_VERIFY -eq '1') { $skip['SkipVerify'] = $true }
          ./install.ps1 -NonInteractive -Components none -NoPath @skip `
            -ArchivePath (Join-Path $release "facet-$version-windows-$arch.zip") `
            -ChecksumPath (Join-Path $release "checksums-windows-$arch.txt")
          $facet = Join-Path $HOME '.facet/current/bin/facet.exe'
          $reported = & $facet version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "facet v$version") { throw "Unexpected version: $reported" }
          # The binary says what it is, in its version information.
          $info = (Get-Item $facet).VersionInfo
          if ($info.ProductName -ne 'Facet' -or $info.FileDescription -ne 'Facet Toolkit' -or $info.ProductVersion -notlike "$version*") {
            throw "facet.exe does not carry Facet's version information: $($info | Format-List | Out-String)"
          }
          & $facet doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $userPath) { throw '-NoPath changed the user PATH' }
      - name: Exercise CLI integrations and media check
        env:
          FACET_INSTALL_SMOKE: '1'
          FACET_INSTALL_SKIP_MEDIA: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' && '1' || '' }}
        run: python scripts/test-prebuilt-install.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} --release-dir build/release
      - name: Windows PowerShell 5.1 lifecycle acceptance
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        env:
          FACET_INSTALL_SMOKE: '1'
          FACET_TEST_POWERSHELL: powershell.exe
        run: python scripts/test-prebuilt-install.py --os windows --arch amd64 --release-dir build/release
      - name: Clean Linux installation with all optional components
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" --workdir /source ubuntu:24.04 bash -c 'export FACET_DOCKER_RELEASE_DIR=/source/build/release; bash scripts/test-installer-docker.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: build/release/*
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Combine checksums
        run: python -c 'from pathlib import Path; p=Path("release"); lines={line for f in p.glob("checksums-*.txt") for line in f.read_text().splitlines()}; (p/"SHA256SUMS.txt").write_text("\n".join(sorted(lines))+"\n",encoding="utf-8")'
      - name: Create draft release (never replace existing assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Facet $GITHUB_REF_NAME" release/facet-* release/SHA256SUMS.txt
